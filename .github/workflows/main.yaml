name: Build image & Deploy to Amazon ECR using OIDC

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-northeast-1

# OIDC認証に必須
permissions:
  id-token: write   # OIDCトークン取得に必要
  contents: read    # リポジトリ読み取りに必要

jobs:
  deploy:
    name: Build-and-Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      # デバッグ用（問題解決後は削除してOK）
      - name: Show GitHub Context
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"

      - name: Checkout
        uses: actions/checkout@v4

      # OIDC認証（アクセスキー不要）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Dockerイメージをビルド
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./mysite
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./mysite
          
          # ECRにプッシュ
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # 出力
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "Image pushed to ECR successfully"
          echo "Repository: ${{ secrets.ECR_REPOSITORY }}"
          echo "Tag: ${{ github.sha }}"
          echo "Latest tag also pushed"
